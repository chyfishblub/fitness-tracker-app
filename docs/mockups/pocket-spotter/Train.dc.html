<style>
body{margin:0}
a{color:#31485C}a:hover{color:#1F2E3C}
.veil{background:rgba(255,255,255,.38);border:1px solid rgba(255,255,255,.59);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}

.step{width:30px;height:30px;border-radius:15px;border:none;background:rgba(255,255,255,.61);color:#31485C;display:flex;align-items:center;justify-content:center;padding:0}

      <div style="display:flex;align-items:center;gap:8px;width:128px"><button type="button" class="step" aria-label="Fewer reps"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M5 12h14"/></svg></button><span class="ui" style="flex-grow:1;text-align:center;font-size:15px;font-weight:700">10</span><button type="button" class="step" aria-label="More reps"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"/></svg></button></div>
    </div>

    <div style="display:flex;align-items:center;gap:10px;padding:10px 16px;opacity:.8">
      <span class="micro" style="width:44px;display:flex;align-items:center;gap:4px;color:#31485C">Set 2 <svg class="ic" viewBox="0 0 24 24" aria-label="done" role="img" style="width:12px;height:12px;stroke-width:2.5"><path d="M5 12l4 4 10-10"/></svg></span>
      <div style="display:flex;align-items:center;gap:8px;width:128px"><button type="button" class="step" aria-label="Less weight"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M5 12h14"/></svg></button><span class="ui" style="flex-grow:1;text-align:center;font-size:15px;font-weight:700">45 kg</span><button type="button" class="step" aria-label="More weight"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <div style="display:flex;align-items:center;gap:8px;width:128px"><button type="button" class="step" aria-label="Fewer reps"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M5 12h14"/></svg></button><span class="ui" style="flex-grow:1;text-align:center;font-size:15px;font-weight:700">10</span><button type="button" class="step" aria-label="More reps"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"/></svg></button></div>

      <span class="micro" style="width:44px;color:#1F2E3C">Set 3</span>
      <div style="display:flex;align-items:center;gap:8px;width:128px"><button type="button" class="step" aria-label="Less weight"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M5 12h14"/></svg></button><span class="ui" style="flex-grow:1;text-align:center;font-size:17px;font-weight:800">45 kg</span><button type="button" class="step" aria-label="More weight"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <div style="display:flex;align-items:center;gap:8px;width:128px"><button type="button" class="step" aria-label="Fewer reps"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M5 12h14"/></svg></button><span class="ui" style="flex-grow:1;text-align:center;font-size:17px;font-weight:800">9</span><button type="button" class="step" aria-label="More reps"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M12 5v14M5 12h14"/></svg></button></div>

  <div style="display:flex;align-items:center;justify-content:center;gap:10px">
    <span class="ctl veil" style="height:32px;padding:0 14px;border-radius:16px;display:inline-flex;align-items:center;gap:8px;color:#1F2E3C"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Rest 90 s · 0:42 left</span>

  <p class="body-copy" style="margin:4px 0 0;text-align:center;font-size:13px;line-height:1.45;color:#F3F5F7">Up next: Overhead press · 3 sets × 8–10 · rest 90 s</p>
