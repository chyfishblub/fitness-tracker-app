<!DOCTYPE html>
<html lang="en" class="pixel">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Juno · Your fitness buddy, in your pocket</title>
  <meta name="description" content="Juno turns meals, workouts and rest into daily quests. Earn XP for every small win. A missed day never costs you anything." />

  <!-- PWA: tells the browser this can be installed as an app -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2A1F3D" />

  <!-- iOS-specific: lets it install to the iPhone home screen and run full-screen -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Juno" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;family=Pixelify+Sans:wght@400..700&amp;family=Press+Start+2P&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="pixel.css" />
</head>
<body>
  <div id="app"></div>

  <!-- Load order matters: each file assumes the previous ones already ran (no bundler). -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/auth.js"></script>

  <!-- Register the service worker = offline support. Only runs when hosted (https/localhost), not file:// -->
  <script>
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        let refreshing = false;
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
          });
        }
        navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
          .then((registration) => registration.update())
          .catch(err => console.log("SW registration skipped:", err));
      });
    }
  </script>
</body>
</html>
